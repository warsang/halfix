# Win10 22H2 x32 test config — Phase 1+2 (Halfix + KernelForge)
# Uses Bochs BIOS (patched) — NOT SeaBIOS (ATAPI bug per compatibility.md)
# RAM 1024M for native (2048M segfaults on ARM macOS SDL; WASM can use 2048M via paging)
# Spec valid 1-3584M, 1024-2048M recommended for Win10 x86 — 1024M is sufficient for 32-bit
bios=bios.bin
vgabios=vgabios.bin
memory=1024M
vgamemory=4M
pci=1
apic=1
acpi=1
pcivga=0
now=400000000
floppy=0

# HDD — 20 GiB raw (sparse, host: truncate -s 20G win10.img)
[ata0-master]
inserted=1
type=hd
driver=sync
file=win10.img

# CD-ROM — Windows 10 22H2 x32 ISO (user-supplied, legitimate license)
[ata0-slave]
inserted=1
type=cd
driver=sync
file=/Users/warsang/Downloads/Win10_22H2_English_x32v1.iso

[ata1-master]
inserted=0
type=none
file=os.img

[ata1-slave]
inserted=0
type=none
file=os.img

[fda]
inserted=0
file=/tmp/floppy.img

[fdb]
inserted=0
file=/tmp/floppy2.img

[boot]
a=cd
b=hd
c=none

[cpu]
cpuid_limit_winnt=0
