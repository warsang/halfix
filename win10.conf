# Win10 22H2 x32 bring-up config (native SDL).
# Setup: put the Win10 22H2 x32 ISO at ./win10.iso, then:
#   truncate -s 20G win10.img
#   ./halfix -c win10.conf
# Unattended install (optional): build answer media from autounattend.xml:
#   mformat -i answer.img -f 1440 :: && mcopy -i answer.img autounattend.xml ::
#   hdiutil makehybrid -o answer.iso answer-dir -iso -joliet -udf
# and set fda + ata1-master below to inserted=1.
bios=bios.bin
vgabios=vgabios.bin
memory=1024M
vgamemory=4M
pci=1
apic=1
acpi=1
pcivga=0
now=400000000
floppy=0

# HDD - 20 GiB raw (sparse host file)
[ata0-master]
inserted=1
type=hd
driver=sync
file=win10.img

# CD-ROM - Windows 10 22H2 x32 ISO
[ata0-slave]
inserted=1
type=cd
driver=sync
file=win10.iso

[ata1-master]
inserted=1
type=cd
driver=sync
file=answer.iso

[ata1-slave]
inserted=0
type=none
file=os.img

[fda]
inserted=1
file=answer.img

[fdb]
inserted=0
file=/tmp/floppy2.img

[boot]
a=cd
b=hd
c=none

[cpu]
cpuid_limit_winnt=0
